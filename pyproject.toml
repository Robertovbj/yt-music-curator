[project]
name = "yt-music-curator"
version = "0.1.0"
description = "Organiza a biblioteca do YouTube Music com features de áudio (Essentia) e playlists reprodutíveis."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "typer>=0.16",
    "ytmusicapi>=1.12,<2",
]

[project.optional-dependencies]
# Pesado (~850 MB com o TensorFlow embutido): só para o worker de análise.
analise = [
    "essentia-tensorflow==2.1b6.dev1438",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
curator = "curator.interfaces.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # o formatador cuida do código; SQL e mensagens longas ficam como estão

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
